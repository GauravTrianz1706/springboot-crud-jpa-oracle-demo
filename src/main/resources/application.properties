# ---------------------------------------------------------------------------
# cr-java-0117: Graceful Shutdown Configuration
# ---------------------------------------------------------------------------
# Enable Spring Boot's built-in graceful shutdown so that SIGTERM signals sent
# by container orchestrators (Kubernetes, Azure Container Apps) during scaling,
# updates, or restarts cause the application to drain in-flight HTTP requests
# before the JVM exits, preventing request loss and resource corruption.
#
# "graceful" mode: Spring Boot stops accepting new requests immediately on
# SIGTERM and waits up to the configured timeout for active requests to complete
# before shutting down the embedded web server and application context.
server.shutdown=graceful

# Maximum time to wait for active requests to complete during graceful shutdown.
# After this period the JVM exits even if requests are still in flight.
# Align this value with the Kubernetes terminationGracePeriodSeconds or the
# Azure Container Apps termination grace period (recommended: 30s).
spring.lifecycle.timeout-per-shutdown-phase=30s
