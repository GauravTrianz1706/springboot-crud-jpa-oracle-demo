
## use create when running the app for the first time
## then change to "update" which just updates the schema when necessary
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5432/orcl
spring.datasource.username=ender
spring.datasource.password=ender123
spring.datasource.driver-class-name=org.postgresql.Driver
## this shows the sql actions in the terminal logs
spring.jpa.show-sql=true
##optional, but just in case another application is listening on your default  port (8080)
server.port = 8088

# cr-java-0117: Graceful Shutdown Configuration
# Enables graceful shutdown so that in-flight HTTP requests are allowed to complete
# before the application context is closed when a SIGTERM is received from GKE or Cloud Run.
# The timeout controls how long Spring Boot waits for active requests to finish.
# Overridable via environment variable GRACEFUL_SHUTDOWN_TIMEOUT (default: 30s).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${GRACEFUL_SHUTDOWN_TIMEOUT:30s}

